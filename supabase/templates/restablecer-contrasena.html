<!-- Supabase → Authentication → Emails → Templates → "Reset password"
     Asunto (Subject): Crea una contraseña nueva para TripFlow -->
<div style="margin:0;padding:24px;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e5e9f2;border-radius:16px;padding:28px;">
    <p style="margin:0 0 4px;font-size:13px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;color:#0284c7;">TripFlow</p>
    <h1 style="margin:0 0 12px;font-size:22px;">Restablece tu contraseña</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#475569;">
      Recibimos una solicitud para cambiar la contraseña de tu cuenta. Toca el botón y TripFlow te pedirá una contraseña nueva.
    </p>
    <p style="margin:0 0 24px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;border-radius:12px;background:#0284c7;color:#ffffff;font-weight:bold;text-decoration:none;">Crear contraseña nueva</a>
    </p>
    <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;">
      Si no lo pediste tú, ignora este correo: tu contraseña actual sigue funcionando.
    </p>
  </div>
</div>
